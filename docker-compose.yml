version: '3.9'

# ==============================================================
# MERN Tech Agency Website — Docker Compose (Production)
# ==============================================================
# Services:
#   - frontend  → React + Vite (served via Nginx) on port 3000
#   - backend   → Node.js / Express API on port 5000
#   - mongo     → MongoDB database on port 27017
#
# Usage:
#   Start:   docker-compose up --build
#   Stop:    docker-compose down
#   Logs:    docker-compose logs -f
#   Shell:   docker-compose exec frontend sh
# ==============================================================

services:

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techagency_frontend
    restart: unless-stopped
    ports:
      - "3000:80"           # Visit: http://localhost:3000
    depends_on:
      - backend
    networks:
      - techagency_network
    environment:
      - NODE_ENV=production
    labels:
      - "com.techagency.service=frontend"
      - "com.techagency.description=React + Vite frontend"

  # ── Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: techagency_backend
    restart: unless-stopped
    ports:
      - "5000:5000"         # API: http://localhost:5000
    environment:
      - NODE_ENV=production
      - PORT=5000
      # MongoDB connection using service name (not localhost!)
      - MONGO_URI=mongodb://mongo:27017/techagency
      # Add your other env vars here or use an .env file below
    env_file:
      - .env.server         # Optional: create this file for secrets
    depends_on:
      mongo:
        condition: service_healthy   # Wait for MongoDB to be ready
    networks:
      - techagency_network
    labels:
      - "com.techagency.service=backend"
      - "com.techagency.description=Node.js Express API"

  # ── MongoDB ──────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: techagency_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"       # MongoDB: mongodb://localhost:27017
    environment:
      # Uncomment and set strong credentials to enable MongoDB authentication.
      # Store real values in .env.server (gitignored), NOT here:
      # MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      # MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
      MONGO_INITDB_DATABASE: techagency
    volumes:
      - mongo_data:/data/db          # Persist database data
      - mongo_config:/data/configdb  # Persist config
    networks:
      - techagency_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "com.techagency.service=mongo"
      - "com.techagency.description=MongoDB database"

# ── Volumes ───────────────────────────────────────────────────
volumes:
  mongo_data:
    name: techagency_mongo_data
    driver: local
  mongo_config:
    name: techagency_mongo_config
    driver: local

# ── Networks ──────────────────────────────────────────────────
networks:
  techagency_network:
    name: techagency_network
    driver: bridge
