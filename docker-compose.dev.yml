version: '3.9'

# ==============================================================
# MERN Tech Agency — Docker Compose (Development)
# ==============================================================
# Features:
#   - Hot-reload for frontend (Vite dev server)
#   - Volume mounts for live code changes
#   - MongoDB with persistent storage
#
# Usage:
#   docker-compose -f docker-compose.dev.yml up --build
# ==============================================================

services:

  # ── Frontend (Dev Server with Hot Reload) ────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: techagency_frontend_dev
    restart: unless-stopped
    ports:
      - "5173:5173"         # Vite dev server: http://localhost:5173
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Prevent host node_modules from overwriting container's
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:5000
    networks:
      - techagency_dev_network

  # ── Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: techagency_backend_dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/techagency_dev
    depends_on:
      - mongo
    networks:
      - techagency_dev_network

  # ── MongoDB ──────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: techagency_mongo_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_dev_data:/data/db
    networks:
      - techagency_dev_network

volumes:
  mongo_dev_data:

networks:
  techagency_dev_network:
    driver: bridge
